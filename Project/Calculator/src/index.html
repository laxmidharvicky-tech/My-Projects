<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body class="min-h-screen w-screen flex justify-center items-center ">
    <div class=" h-fit w-96 m-4 rounded-xl shadow-2xl/50 bg-cyan-300">
        <div class="ml-8 mr-8 mt-8 p-3.5">
            <input type="text" placeholder="0" class=" w-72 h-14 text-4xl rounded-xl shadow-2xl/20 bg-white ">
        </div>
        <div class="ml-8  p-3.5">
            <button type="button" class=" h-11 w-14 mr-4 rounded-xl bg-gray-500 text-white hover:bg-gray-700">%</button>
            <button type="button" class=" h-11 w-14 mr-4 rounded-xl bg-gray-500 text-white hover:bg-gray-700">CE</button>
            <button type="button" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">C</button>
            <button type="button" class=" h-11 w-14 mr-4 rounded-xl bg-red-500 text-white hover:bg-gray-700">Delete</button>
        </div>
        <div class="ml-8  p-3.5">
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">7</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">8</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">9</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white">+</button>
        </div>
        <div class="ml-8  p-3.5">
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">4</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">5</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">6</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">-</button>
        </div>
        <div class="ml-8 p-3.5">
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">1</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">2</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">3</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">*</button>
        </div>

        <div class="ml-8  p-3.5">
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">00</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl  bg-gray-500 text-white hover:bg-gray-700">.</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl bg-gray-500 text-white hover:bg-gray-700">/</button>
            <button type="submit" class=" h-11 w-14 mr-4 rounded-xl bg-gray-500 text-white hover:bg-gray-700">,</button>
        </div>
    </div>

</body>

</html>
