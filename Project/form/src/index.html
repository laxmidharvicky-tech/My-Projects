<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="./output.css">
</head>

<body class="bg-blue-600 font-serif box-border">
    <div class="flex flex-row justify-center items-center gap-9  h-screen">
        <div class="bg-white w-96 h-96">
            <div class="flex flex-row  justify-center items-center mt-4  pt-6 pb-6 ">
                <div class=" border border-blue-400 h-10 w-32 flex justify-center items-center">SIGNIN</div>
                <DIV class="bg-blue-400 text-white h-10 w-32 flex justify-center items-center hover:bg-blue-700">SIGN UP
                </DIV>
            </div>
            <div class="flex flex-row justify-center gap-4">
                <div class="h-10 w-28 bg-blue-500 flex justify-center pt-2 text-white font-bold
                text-2xl pb-2 font-mono hover:bg-blue-800">F</div>
                <div
                    class="h-10 w-28 flex justify-center pt-2 text-white font-bold text-2xl pb-2 font-mono bg-red-400 hover:bg-red-800">
                    G</div>
            </div>
            <div class="ml-11 mr-9 mt-4 w-64">
                <DIV class="flex justify-center pl-7">
                    <input type="text" placeholder="E-mail" class="h-9 w-64 p-3.5 border border-blue-400 mt-3">
                </DIV>
                <div class="flex justify-center pl-7">
                    <input type="text" placeholder="Password" class="h-9 w-64 p-3.5 border border-blue-400 mt-5">
                </div>
                <div class="flex justify-center pl-7">
                    <button type="submit" class="h-7 w-64 bg-blue-500 text-white mt-5 text-sm hover:bg-blue-700">SIGN
                        IN</button>
                </div>
            </div>
        </div>
        <div class="bg-white  w-96 h-96">
            <div class="flex flex-row  justify-center items-center mt-4  pt-6 pb-6 ">
                <div class=" bg-blue-400 text-white h-10 w-32 flex justify-center items-center hover:bg-blue-800">SIGNIN
                </div>
                <DIV class="border border-blue-400 h-10 w-32 flex justify-center items-center">SIGN UP</DIV>
            </div>
            <div class="ml-11 mr-9 mt-4 w-64">
                <div class="flex justify-center pl-7">
                    <input type="text" placeholder="Username" class="h-9 w-64 p-3.5 border border-blue-400 mt-3">
                </div>
                <DIV class="flex justify-center pl-7">
                    <input type="text" placeholder="E-mail" class="h-9 w-64 p-3.5 border border-blue-400 mt-5">
                </DIV>
                <div class="flex justify-center pl-7">
                    <input type="text" placeholder="Password" class="h-9 w-64 p-3.5 border border-blue-400 mt-5">
                </div>
                <div class="flex justify-center pl-7">
                    <button type="submit" class="h-7 w-64 bg-blue-500 text-white mt-5 text-sm hover:bg-blue-800">SIGN
                        UP</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
