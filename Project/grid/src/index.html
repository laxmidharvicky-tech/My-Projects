<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body class="bg-amber-100 flex justify-center items-center ">
    <div class= "h-96 w-96 grid grid-cols-2 grid-rows-2 gap-7 mt-48 ">
        <div class="bg-amber-950 grid col-span-2 flex justify-center items-center rounded-4xl transition-all duration-300 ease-in-out
               hover:bg-indigo-700
               hover:scale-105
               hover:-translate-y-1
               hover:shadow-xl text-white animate-float hover:cursor-pointer">
            <h1 class="text-4xl">Hello</h1>
        </div>
        <div class="bg-green-600 flex justify-center items-center rounded-4xl transition-all duration-300 ease-in-out
               hover:bg-pink-900
               hover:scale-105
               hover:-translate-y-1
               hover:shadow-xl text-white hover:cursor-pointer">
        <h2 class="text-4xl">Vicky</h2>
        </div>
        <div class="bg-red-700 flex justify-center items-center rounded-4xl transition-all duration-300 ease-in-out
               hover:bg-orange-500
               hover:scale-105
               hover:-translate-y-1
               hover:shadow-xl text-white hover:cursor-pointer">
            <h2 class="text-4xl">Jena</h2>
        </div>
    </div>
    
</body>
</html>
